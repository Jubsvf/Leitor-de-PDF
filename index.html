<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extração de Dados de Nota Fiscal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Cabeçalho Principal -->
    <header class="header-section">
      <h1 class="main-title">Extração de Dados de Nota Fiscal</h1>
      <p class="subtitle">Carregue um PDF de nota fiscal e extraia os dados automaticamente usando IA</p>
    </header>

    <!-- Card de Upload (Figura 1) -->
    <section class="card upload-card" id="uploadCard">
      <div class="card-header">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span class="card-title">Upload do PDF</span>
      </div>

      <div class="upload-content">
        <label for="pdfInput" class="upload-label">Selecione o arquivo PDF da nota fiscal</label>
        
        <div class="file-input-wrapper">
          <input type="file" id="pdfInput" accept="application/pdf" class="real-file-input">
          <label for="pdfInput" class="custom-file-btn" id="filePickerBtn">Escolher arquivo</label>
          <span class="file-status-text" id="fileStatusText">Nenhum arquivo escolhido</span>
        </div>

        <!-- Informações do Arquivo Selecionado -->
        <div class="file-info-box hidden" id="fileInfoBox">
          <div class="file-info-main">
            <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span class="file-name" id="fileName">arquivo.pdf</span>
          </div>
          <div class="file-meta">
            <span class="file-size" id="fileSize">0.00 MB</span>
            <button type="button" class="btn-remove-file" id="btnRemoveFile" title="Remover arquivo" aria-label="Remover arquivo">&times;</button>
          </div>
        </div>

        <!-- Botão de Ação -->
        <button type="button" class="btn-action" id="btnExtract" disabled>
          <svg class="sparkle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
          </svg>
          <span id="btnText">EXTRAIR DADOS</span>
        </button>
      </div>
    </section>

    <!-- Legenda da Figura conforme material da atividade -->
    <div class="figure-source">
      Fonte: Autor (2025)
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
